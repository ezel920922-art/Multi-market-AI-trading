name: Tests

# The opt-in integration suite uses one isolated Neon branch; serialize runs to prevent cross-run contamination.
concurrency:
  group: trading-postgres-integration-${{ github.repository }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRADING_TEST_DATABASE_URL: ${{ secrets.TRADING_TEST_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q --ignore=tests/test_postgres_integration.py
      - name: Run isolated PostgreSQL integration tests
        if: ${{ env.TRADING_TEST_DATABASE_URL != '' }}
        run: python -m pytest -q tests/test_postgres_integration.py
